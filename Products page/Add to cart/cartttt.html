<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
}
.cart-container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}
.cart-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}
.cart-item img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}
.cart-total {
    margin-top: 10px;
    text-align: right;
    font-weight: bold;
}
.checkout-btn, .remove-btn {
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.checkout-btn {
    background-color: #28a745;
    color: white;
    margin-top: 10px;
}
.remove-btn {
    background-color: #dc3545;
    color: white;
}

    </style>
</head>
<body>
    <div class="cart-container">
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>
        <div class="cart-total">Total: Nrs.<span id="totalAmount">0</span></div>
        <button class="checkout-btn" onclick="checkout()">Checkout</button>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function displayCart() {
            const cartContainer = document.getElementById('cartItems');
            const totalElement = document.getElementById('totalAmount');
            cartContainer.innerHTML = cart.length ? '' : '<p>Your cart is empty</p>';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div><img src="watch${index + 1}.webp" alt="${item.name}"> ${item.name} - ₹${item.price}</div>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>`;
            });
            totalElement.textContent = total;
        }
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        function checkout() {
            if (cart.length) alert('Proceeding to checkout...');
            else alert('Your cart is empty!');
        }
        displayCart();
    </script>
</body>
</html>
